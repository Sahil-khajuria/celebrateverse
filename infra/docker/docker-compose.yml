version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: celebrateverse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: celebrateverse
      MYSQL_USER: ${MYSQL_USER:-cvuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cvpassword}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-rootpassword}']
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 40s
    networks:
      - celebrateverse-network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: celebrateverse-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/celebrateverse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cvuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-cvpassword}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,https://${DOMAIN:-localhost}
      APP_BASE_URL: https://${DOMAIN:-localhost}
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - celebrateverse-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: celebrateverse-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - celebrateverse-network

  nginx:
    image: nginx:alpine
    container_name: celebrateverse-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - celebrateverse-network

volumes:
  mysql_data:
    name: celebrateverse_mysql_data
  certbot_www:
  certbot_conf:

networks:
  celebrateverse-network:
    driver: bridge
